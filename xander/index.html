<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xander's Secret Arcade</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 20%,#393064,#100e24 75%);color:white;font-family:system-ui;text-align:center}h1{color:#ffe78c;text-shadow:0 4px #8d348f,0 0 20px #ec6ce8;font-size:clamp(2rem,6vw,4rem);margin:25px 10px 8px}p{color:#d8d3ff}.room{max-width:1200px;margin:30px auto;padding:30px 15px 65px;background:linear-gradient(#292347 70%,#493253);border-radius:20px}.machines{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}button{font:inherit;cursor:pointer}.machine{min-height:360px;border:5px solid #ffffff35;border-radius:28px 28px 12px 12px;background:linear-gradient(90deg,#181328,var(--color) 22% 78%,#181328);color:white;padding:13px;box-shadow:8px 12px #090a1c;display:flex;flex-direction:column;gap:15px}.machine:hover,.machine:focus-visible{transform:translateY(-6px);outline:3px solid #ffed9c}.sign{background:#1c1a38;border:4px solid #111329;border-radius:13px;padding:12px 4px;font-weight:900;color:#ffe6a2;min-height:68px}.screen{flex:1;background:radial-gradient(circle,#5287a5,#11142c);border:8px solid #131728;border-radius:15px;display:grid;place-content:center;font-size:70px}.screen small{font-size:15px;font-weight:800}.tag{background:#211d3b;border-radius:30px;padding:8px;color:#ffefaa;font-weight:800}.overlay{position:fixed;inset:0;display:none;background:#0a1024;z-index:5;flex-direction:column}.overlay.open{display:flex}.toolbar{background:#242044;padding:8px;display:flex;justify-content:space-between;align-items:center}.toolbar button,.modal button{background:#ffe28c;color:#20213a;border:0;border-radius:12px;padding:12px;font-weight:900}iframe{flex:1;width:100%;border:0;min-height:0}.modal{position:fixed;inset:0;background:#080b1bdc;display:none;place-items:center;z-index:6}.modal.open{display:grid}.modal>div{background:#fff5dc;color:#292544;padding:30px;border-radius:20px;max-width:350px}@media(max-width:800px){.machines{grid-template-columns:repeat(2,1fr)}.machine{min-height:310px}.screen{font-size:52px}}@media(max-width:380px){.machines{gap:9px}.machine{padding:7px;min-height:280px}.sign{font-size:13px}}</style><h1>✦ XANDER'S SECRET ARCADE ✦</h1><p>Pick a machine. Enter a new adventure!</p><main class="room"><div class="machines"><button class="machine" style="--color:#6547b6" data-game="fuzzy"><span class="sign">FUZZY BUG<br>MATH FACTORY</span><span class="screen">🐛<small>BOUNCE INTO MATH!</small></span><span class="tag">▶ PLAY NOW</span></button><button class="machine" style="--color:#237b98" data-game="train"><span class="sign">TRAIN TRACK<br>ADVENTURE</span><span class="screen">🚂<small>BUILD THE RAILWAY</small></span><span class="tag">COMING SOON</span></button><button class="machine" style="--color:#aa6941" data-game="history"><span class="sign">HISTORY QUEST</span><span class="screen">🏛️<small>FIND THE TREASURE</small></span><span class="tag">COMING SOON</span></button><button class="machine" style="--color:#48816a" data-game="town"><span class="sign">XANDER'S NEIGHBORHOOD</span><span class="screen">🏘️<small>BUILD YOUR WORLD</small></span><span class="tag">COMING SOON</span></button></div></main><p>New machines will light up as more games arrive!</p><section class="overlay" id="overlay"><div class="toolbar"><strong>🐛 Fuzzy Bug Math Factory</strong><button id="back">← BACK TO ARCADE</button></div><iframe id="game" title="Fuzzy Bug Math Factory" allow="accelerometer; gyroscope"></iframe></section><section class="modal" id="modal"><div><h2>🕹️ Coming Soon!</h2><p>This game is being built. Try Fuzzy Bug Math Factory!</p><button id="close">BACK TO ARCADE</button></div></section><script>const overlay=document.querySelector('#overlay'),game=document.querySelector('#game'),modal=document.querySelector('#modal');document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{if(b.dataset.game==='fuzzy'){game.src='./fuzzy-bug-math-factory/index.html';overlay.classList.add('open')}else modal.classList.add('open')});document.querySelector('#back').onclick=()=>{overlay.classList.remove('open');game.src='about:blank'};document.querySelector('#close').onclick=()=>modal.classList.remove('open');</script></html>
