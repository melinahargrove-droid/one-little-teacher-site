<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Fuzzy Bug Math Factory</title><style>*{box-sizing:border-box}body{margin:0;background:#14243d;color:white;font-family:system-ui;display:grid;place-items:center;min-height:100dvh}#wrap{position:relative;width:min(100vw,520px);height:min(100dvh,850px);overflow:hidden;background:#92dcf4}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-weight:900;text-shadow:1px 2px #345}#panel{position:absolute;inset:0;background:#172b4ccc;display:grid;place-items:center;padding:20px}#card{background:#fff9e9;color:#24334c;border:5px solid #344a76;border-radius:24px;padding:20px;max-width:390px;width:100%;text-align:center;box-shadow:0 12px #15243c}h1{font-size:26px;margin:0 0 12px}button,select{font:800 18px system-ui;border:0;border-radius:13px;padding:12px;background:#ffcb56;color:#27364c;margin:5px;cursor:pointer}button:active{transform:translateY(3px)}.answers{display:grid;grid-template-columns:1fr 1fr;gap:7px}.answers button{background:#b5e7ad}#controls{position:absolute;bottom:16px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}#controls button{pointer-events:auto;background:#ffffffc9;border:3px solid #41668b;font-size:30px;width:88px;height:65px;touch-action:none;user-select:none}small{color:#60708b}</style><div id="wrap"><canvas id="game" width="480" height="760"></canvas><div id="hud"><span id="score">⭐ 0</span><span id="level">Floor 1</span><span id="lives">❤️❤️❤️</span></div><div id="controls"><button id="left">◀</button><button id="right">▶</button></div><div id="panel"><div id="card"></div></div></div><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),panel=document.querySelector('#panel'),card=document.querySelector('#card'),W=480,H=760,R=18;let tiltEnabled=false,tiltSeen=false,tiltRaw=0,tiltNeutral=0,tiltValue=0,tiltMessage='Not started',mode='adventure',skill='mixed',score=0,lives=3,floor=1,active=false,question=false,keys={left:false,right:false},player,platforms=[],camera=0,highest=0,last=0,raf=0;
function rand(a,b){return Math.random()*(b-a)+a}function status(s){tiltMessage=s;const el=document.querySelector('#sensorState');if(el)el.textContent=s}
function onTilt(e){const angle=screen.orientation?.angle??window.orientation??0;let raw=Math.abs(angle)%180===90?(angle===90?e.beta:-e.beta):e.gamma;if(!Number.isFinite(raw))return;tiltRaw=raw;tiltSeen=true;status('Connected ✓');let d=raw-tiltNeutral;tiltValue=Math.abs(d)<3?0:Math.max(-1,Math.min(1,d/17))}
function calibrateTilt(){tiltNeutral=tiltRaw;tiltValue=0;status(tiltSeen?'Calibrated ✓':'No sensor readings yet')}
async function enableTilt(){if(tiltEnabled)return;if(!window.isSecureContext){status('Requires HTTPS');return}if(!('DeviceOrientationEvent'in window)){status('Motion sensors unavailable');return}try{if(typeof DeviceOrientationEvent.requestPermission==='function'){if(await DeviceOrientationEvent.requestPermission()!=='granted'){status('Permission denied');return}}window.addEventListener('deviceorientation',onTilt);tiltEnabled=true;status('Waiting for sensor…');setTimeout(()=>{if(!tiltSeen)status('Not detected — check browser permissions');else calibrateTilt()},1400)}catch(e){status('Blocked: '+e.message)}}
function menu(){cancelAnimationFrame(raf);active=false;panel.style.display='grid';card.innerHTML='<h1>🐛 Fuzzy Bug Math Factory!</h1><p>Steer your fuzzy bug while it <b>bounces automatically!</b> Grab stars and solve math challenges.</p><p>Mode <select id="mode"><option value="adventure">Adventure</option><option value="practice">Endless math practice</option></select></p><p>Math <select id="skill"><option value="mixed">Mixed second-grade math</option><option value="add">Addition</option><option value="sub">Subtraction</option><option value="place">Place value</option><option value="mult">Early multiplication</option></select></p><button id="play">PLAY!</button><button id="calibrate">CALIBRATE TILT</button><p><small>Tilt: <span id="sensorState">'+tiltMessage+'</span></small></p><p><small>Hold the phone naturally and calibrate. Touch arrows also work.</small></p>';document.querySelector('#play').onclick=start;document.querySelector('#calibrate').onclick=async()=>{await enableTilt();calibrateTilt()}}
async function start(){mode=document.querySelector('#mode').value;skill=document.querySelector('#skill').value;await enableTilt();score=0;lives=3;floor=1;reset();panel.style.display='none';active=true;last=performance.now();raf=requestAnimationFrame(loop)}
function reset(){camera=0;highest=0;player={x:240,y:665,vx:0,vy:-13};platforms=[{x:155,y:710,w:170,star:false}];for(let i=1;i<17;i++)platforms.push({x:rand(22,340),y:710-i*92,w:rand(95,140),star:true,moving:i%5===0,phase:rand(0,6.28)});hud()}
function hud(){document.querySelector('#score').textContent='⭐ '+score;document.querySelector('#level').textContent='Floor '+floor;document.querySelector('#lives').textContent='❤️'.repeat(lives)}
function makeQuestion(){let s=skill==='mixed'?['add','sub','place','mult'][Math.floor(rand(0,4))]:skill,a,b,answer,prompt;if(s==='add'){a=Math.floor(rand(8,65));b=Math.floor(rand(6,35));answer=a+b;prompt=a+' + '+b+' = ?'}else if(s==='sub'){a=Math.floor(rand(25,100));b=Math.floor(rand(5,a));answer=a-b;prompt=a+' − '+b+' = ?'}else if(s==='place'){a=Math.floor(rand(2,10));b=Math.floor(rand(1,10));answer=a*10+b;prompt=a+' tens and '+b+' ones = ?'}else{a=Math.floor(rand(2,7));b=Math.floor(rand(2,6));answer=a*b;prompt=a+' × '+b+' = ?'}let opts=new Set([answer]);while(opts.size<4){let n=answer+Math.floor(rand(-15,16));if(n>=0)opts.add(n)}let choices=[...opts].sort(()=>Math.random()-.5);question=true;active=false;panel.style.display='grid';card.innerHTML='<h1>🔧 Power the machine!</h1><p style="font-size:32px;font-weight:900">'+prompt+'</p><div class="answers">'+choices.map(n=>'<button data-answer="'+n+'">'+n+'</button>').join('')+'</div><p id="feedback"><small>Choose the correct answer!</small></p>';card.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(Number(b.dataset.answer)===answer){score+=20;floor++;hud();card.innerHTML='<h1>🎉 Machine activated!</h1><p>Fantastic math!</p><button id="continue">KEEP HOPPING!</button>';document.querySelector('#continue').onclick=()=>{question=false;reset();panel.style.display='none';active=true;last=performance.now();raf=requestAnimationFrame(loop)}}else{document.querySelector('#feedback').textContent='Try another answer!';b.style.background='#f9aaa2';b.disabled=true}})}
function lose(){lives--;hud();if(lives<=0&&mode==='adventure'){active=false;panel.style.display='grid';card.innerHTML='<h1>Great hopping!</h1><p>You collected '+score+' stars and reached floor '+floor+'.</p><button id="again">PLAY AGAIN</button>';document.querySelector('#again').onclick=menu;return}player.x=240;player.y=665;player.vy=-13;player.vx=0;camera=0}
function loop(t){if(!active)return;let dt=Math.min((t-last)/16.67,2);last=t;update(dt,t);draw();if(active)raf=requestAnimationFrame(loop)}
function update(dt,t){const oldY=player.y,steer=(Number(keys.right)-Number(keys.left))||(tiltEnabled?tiltValue:0);player.vx+=steer*.75*dt;player.vx*=Math.pow(.85,dt);player.vx=Math.max(-6,Math.min(6,player.vx));player.x+=player.vx*dt;if(player.x< -R)player.x=W+R;if(player.x>W+R)player.x=-R;player.vy+=.42*dt;player.y+=player.vy*dt;for(const p of platforms){if(p.moving)p.x+=Math.sin(t/450+p.phase)*.5*dt;if(player.vy>0&&oldY+R<=p.y+10&&player.y+R>=p.y&&player.x+R>p.x&&player.x-R<p.x+p.w){player.y=p.y-R;player.vy=-13.4;if(p.star){p.star=false;score+=10;hud()}}}if(player.y-camera<285)camera=player.y-285;if(player.y-camera>H+70)lose();highest=Math.min(highest,player.y);if(highest< -560&&!question)makeQuestion()}
function draw(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#70c4e6');g.addColorStop(1,'#d6f8f1');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(0,-camera);for(let y=-1800;y<800;y+=260){ctx.fillStyle='#ffffff2a';ctx.fillRect(0,y,W,8)}for(const p of platforms){if(p.y-camera < -40||p.y-camera>H+50)continue;ctx.fillStyle='#425e82';ctx.fillRect(p.x+4,p.y+8,p.w,16);ctx.fillStyle='#e7a958';ctx.beginPath();ctx.roundRect(p.x,p.y,p.w,18,7);ctx.fill();if(p.star){ctx.fillStyle='#ffd34f';ctx.font='27px system-ui';ctx.fillText('★',p.x+p.w/2-13,p.y-12)}}let {x,y}=player;ctx.fillStyle='#50357d';for(let i=0;i<22;i++){let a=i*Math.PI/11;ctx.beginPath();ctx.ellipse(x+Math.cos(a)*20,y+Math.sin(a)*21,7,12,a,0,7);ctx.fill()}ctx.fillStyle='#a978e5';ctx.beginPath();ctx.arc(x,y,25,0,7);ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(x-9,y-5,8,0,7);ctx.arc(x+9,y-5,8,0,7);ctx.fill();ctx.fillStyle='#203047';ctx.beginPath();ctx.arc(x-7,y-4,3.5,0,7);ctx.arc(x+11,y-4,3.5,0,7);ctx.fill();ctx.restore()}
for(const side of ['left','right']){const b=document.querySelector('#'+side);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[side]=true;b.setPointerCapture?.(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys[side]=false)}document.addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true});document.addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false});menu();draw();
</script></html>
